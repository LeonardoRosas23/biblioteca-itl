# API Gateway · único punto de entrada público (figura 5.1)
# - Enruta /api/v1/* al microservicio dueño de cada recurso.
# - Genera o propaga X-Correlation-Id (D8).
# - Bloquea las rutas internas y borra X-Service-Token de las peticiones externas (sección 5.7).

worker_processes auto;
events { worker_connections 1024; }

http {
  log_format con_id '$remote_addr [$time_local] "$request" $status $body_bytes_sent cid=$cid t=$request_time';
  access_log /dev/stdout con_id;
  error_log /dev/stderr warn;

  map $http_x_correlation_id $cid {
    ""      $request_id;
    default $http_x_correlation_id;
  }

  upstream usuarios       { server usuarios:3001; }
  upstream catalogo       { server catalogo:8000; }
  upstream prestamos      { server prestamos:8080; }
  upstream notificaciones { server notificaciones:8090; }
  upstream panel          { server web:80; }

  # HTTP: desarrollo local y app móvil en la red del laboratorio
  server {
    listen 80;
    include /etc/nginx/rutas.conf;
  }

  # HTTPS (RNF06). El certificado se genera autofirmado al arrancar si no hay uno en gateway/certs/;
  # en producción se coloca ahí el certificado real (servidor.crt y servidor.key).
  server {
    listen 443 ssl;
    http2 on;
    ssl_certificate     /etc/nginx/certs/servidor.crt;
    ssl_certificate_key /etc/nginx/certs/servidor.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    # En producción, con certificado real y dominio propio, agregar aquí:
    #   add_header Strict-Transport-Security "max-age=31536000" always;
    # (no se activa por defecto: en "localhost" obligaría al navegador a usar HTTPS también en el puerto 8080)
    include /etc/nginx/rutas.conf;
  }
}
