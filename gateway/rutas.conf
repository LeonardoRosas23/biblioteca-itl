# Rutas comunes del gateway; las usan los servidores HTTP (80) y HTTPS (443) de nginx.conf.

client_max_body_size 1m;

proxy_set_header Host $host;
proxy_set_header X-Correlation-Id $cid;
proxy_set_header X-Service-Token "";        # nadie de afuera se hace pasar por un servicio
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_connect_timeout 3s;
proxy_read_timeout 15s;
add_header X-Correlation-Id $cid always;
proxy_hide_header X-Correlation-Id;           # los servicios también lo devuelven: que no salga duplicado

# ---------- rutas internas: solo accesibles dentro de la red de Docker ----------
location ~ ^/api/v1/recursos/[^/]+/reservas { return 403 '{"codigo":"RUTA_INTERNA","mensaje":"Ruta reservada para servicios internos."}'; }

# Con y sin barra final: POST /api/v1/notificaciones/ también es la ruta interna de creación
location ~ ^/api/v1/notificaciones/?$ {
  if ($request_method = POST) { return 403 '{"codigo":"RUTA_INTERNA","mensaje":"Ruta reservada para servicios internos."}'; }
  proxy_pass http://notificaciones;
}

# Conciliación de reservas (D5): solo Préstamos la consulta, desde la red interna
location ^~ /api/v1/reservas { return 403 '{"codigo":"RUTA_INTERNA","mensaje":"Ruta reservada para servicios internos."}'; }

# ---------- enrutamiento por servicio ----------
location /api/v1/auth/          { proxy_pass http://usuarios; }
location /api/v1/usuarios       { proxy_pass http://usuarios; }
location /api/v1/recursos       { proxy_pass http://catalogo; }
location /api/v1/categorias     { proxy_pass http://catalogo; }
location /api/v1/catalogo/      { proxy_pass http://catalogo; }   # documentación OpenAPI de FastAPI
location /api/v1/prestamos      { proxy_pass http://prestamos; }
location /api/v1/multas         { proxy_pass http://prestamos; }
location /api/v1/notificaciones/ { proxy_pass http://notificaciones; }

location /api/ { return 404 '{"codigo":"RUTA_NO_ENCONTRADA","mensaje":"La ruta solicitada no existe."}'; }

location = /health { return 200 '{"servicio":"gateway","estado":"OK"}'; }

# ---------- panel web (React) ----------
location / { proxy_pass http://panel; }

default_type application/json;

