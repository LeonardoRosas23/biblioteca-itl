# Producción (servidor con dominio propio, p. ej. Oracle Cloud + DuckDNS):
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
# Caddy recibe el tráfico en 80/443, obtiene y renueva solo el certificado de Let's Encrypt
# para ${DOMINIO} y lo pasa al gateway. El gateway ya no se publica directamente.
services:
  gateway:
    ports: !reset []

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      DOMINIO: ${DOMINIO:?Falta DOMINIO en .env (p. ej. bibliotecaitl.duckdns.org)}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-datos:/data
      - caddy-config:/config
    depends_on: [gateway]

volumes:
  caddy-datos:
  caddy-config:
